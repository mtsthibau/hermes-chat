  build-web:
    name: Build Web Apps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (Turbo)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Package standalone outputs into ZIP files
        run: |
          set -euo pipefail
          mkdir -p dist

          for APP in hermes-chat hermes-gps; do
            STAGE="${APP}-standalone"
            mkdir -p "${STAGE}/apps/${APP}/.next"

            # Copy standalone server (already contains a trimmed node_modules)
            cp -r "apps/${APP}/.next/standalone/." "${STAGE}/"

            # Add static chunks and public assets (not included in standalone)
            cp -r "apps/${APP}/.next/static" "${STAGE}/apps/${APP}/.next/static"
            cp -r "apps/${APP}/public"       "${STAGE}/apps/${APP}/public"

            (cd "${STAGE}" && zip -r "../dist/${APP}.zip" .)
            rm -rf "${STAGE}"
          done

      - name: Upload ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-builds
          path: dist/*.zip
          retention-days: 30

build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/hermes-chat/package.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Initialize Capacitor Android project
        # Only runs when the android/ directory is not committed to the repo.
        working-directory: apps/hermes-chat
        run: |
          [ -d android ] || npx cap add android

      - name: Sync Capacitor (injects HERMES_CHAT_URL into the Android project)
        working-directory: apps/hermes-chat
        run: npx cap sync android
        env:
          # Set HERMES_CHAT_URL as a repository variable in GitHub
          # (Settings → Variables → Actions) to point at your server.
          HERMES_CHAT_URL: ${{ vars.HERMES_CHAT_URL || 'http://localhost:3000' }}

      - name: Build release APK
        working-directory: apps/hermes-chat/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      # Signing is optional: configure these four secrets in GitHub to enable it.
      #   SIGNING_KEY          – base64-encoded JKS/PKCS12 keystore file
      #   KEY_ALIAS            – key alias inside the keystore
      #   KEY_STORE_PASSWORD   – keystore password
      #   KEY_PASSWORD         – key password
      - name: Detect signing key availability
        id: check_signing
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

      - name: Sign APK
        if: steps.check_signing.outputs.available == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: apps/hermes-chat/android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Resolve final APK path
        id: find_apk
        run: |
          SIGNED="${{ steps.sign_apk.outputs.signedReleaseFile }}"
          if [ -n "$SIGNED" ]; then
            echo "path=$SIGNED" >> "$GITHUB_OUTPUT"
          else
            APK=$(find apps/hermes-chat/android/app/build/outputs/apk/release \
                    -name '*.apk' | head -1)
            echo "path=$APK" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hermes-chat-apk
          path: ${{ steps.find_apk.outputs.path }}
          retention-days: 30

  # ── 4. Create GitHub Release (tags only) ─────────────────────────────────
